[project]
name = "kontxt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.11.0",
    "build==1.3.0",
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "fastapi==0.121.2",
    "fastapi>=0.104.0",
    "h11==0.16.0",
    "idna==3.11",
    "packaging==25.0",
    "pydantic-core==2.41.5",
    "pydantic==2.12.4",
    "pyproject-hooks==1.2.0",
    "requests==2.32.5",
    "requests>=2.31.0",
    "sniffio==1.3.1",
    "starlette==0.49.3",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.5.0",
    "uvicorn==0.38.0"
    ]



[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
